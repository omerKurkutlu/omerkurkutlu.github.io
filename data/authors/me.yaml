experience:
  - role: Research Assistant
    org: University of Illinois Chicago
    start: 2024-08-01
    summary: |
      Research under the supervision of Dr. Arman Roohi.
      - **Crazyflie Isaac Framework (CIF):** Developed and open-sourced a modular NVIDIA Isaac Sim framework for Crazyflie research, integrating configurable controllers, sensors, environments, and autonomous algorithms for DRL, multi-drone, benchmarking, and sim-to-real experimentation ([GitHub](https://github.com/omerKurkutlu/Crazyflie-Isaac-Framework)).
      - **Vision-Language-Action (VLA) for Embodied Robotics (ongoing):** Developing an application-specific VLA framework for resource-constrained robots, exploring DINO/SigLIP vision encoders, LoRA-adapted LLaMA models, knowledge distillation, imitation learning, and simulation-based RL for task-specific policy learning.
      - **Vision-Based Tiny-Drone Navigation:** Developed and deployed a fully onboard Crazyflie navigation stack integrating INT8 monocular depth, multi-range sensing, occupancy mapping, and dynamic path planning on GAP8.
      - **Edge Perception / Temporal Consistency:** Developed lightweight TinyML perception for resource-constrained edge platforms, including temporally consistent obstacle detection, embedded inference, BLE, and energy-aware sensing.

  - role: Teaching Assistant
    org: University of Illinois Chicago
    start: 2025-01-01
    summary: |
      Computer Architecture (senior-level undergraduate course). Delivered a SimpleScalar tutorial, supported students in computer architecture topics, and graded assignments/exams with technical feedback and mentorship.

  - role: Research Assistant
    org: University of Notre Dame
    start: 2023-05-01
    end: 2024-08-01
    summary: |
      Research under the supervision of Dr. Yasemin Ozkan Aydin.
      - **Learning-Based Quadruped Locomotion:** Developed DQN-based locomotion for a salamander-inspired quadruped, integrating spinal–limb coordination and validating policies in simulation and on a physical Dynamixel/Raspberry Pi platform ([Demo](https://www.youtube.com/watch?v=JR5QI67bjq8)).
      - **Autonomous Tunnel Burrowing System:** Developed and field-tested an autonomous excavation robot integrating depth perception, force/torque sensing, motion planning, and interchangeable tools ([Demo](https://www.youtube.com/playlist?list=PLxYZuRPj6mQYaS3WxGKvuIG2CWHJ25YgB)).

  - role: Robotics Software Engineer
    org: Kontrolmatik Technologies
    start: 2022-01-01
    end: 2022-09-01
    summary: |
      Motion Planning & Robot Control. Developed C++/ROS motion-planning and control software for UR5e robots using inverse kinematics, collision checking, MoveIt, OMPL, and CHOMP.

