bio: |
  I am a Ph.D. candidate in Electrical and Computer Engineering at the University of Illinois Chicago, advised by Dr. Arman Roohi. I specialize in robot learning, Physical AI, and autonomous systems. My research focuses on deep reinforcement learning, vision-language-action models, vision-based navigation, sim-to-real, and resource-constrained robotics, with hands-on experience in NVIDIA Isaac Sim/Isaac Lab, ROS/ROS2, and embedded AI.

